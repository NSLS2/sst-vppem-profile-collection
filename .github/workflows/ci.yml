name: VPPEM CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Rebuild images even if env-<hash> already exists"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      repo: ${{ steps.tag.outputs.repo }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(ci/image-tag.sh)"
          echo "Image tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: image-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: queueserver
            pixi_env: qs
          - image: gui
            pixi_env: gui
          - image: sim
            pixi_env: sim
    concurrency:
      group: build-${{ matrix.image }}-${{ needs.image-tag.outputs.tag }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.image-tag.outputs.repo }}/vppem-${{ matrix.image }}
      TAG: ${{ needs.image-tag.outputs.tag }}
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing image
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.force_build }}" != "true" ]] \
            && docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "${IMAGE}:${TAG} already exists; skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: ${{ steps.check.outputs.build == 'true' }}
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        if: ${{ steps.check.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.image }}
        if: ${{ steps.check.outputs.build == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./images/profile/Containerfile
          build-args: |
            PIXI_ENV=${{ matrix.pixi_env }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  test:
    needs: [ image-tag, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NBS_IMAGE_TAG: ${{ needs.image-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true
          environments: pods

      - name: Smoke test
        run: pixi run -e pods smoke-test

  tag-branch:
    needs: [ image-tag, test ]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      REPO: ${{ needs.image-tag.outputs.repo }}
      TAG: ${{ needs.image-tag.outputs.tag }}
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images as ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          for image in queueserver gui sim; do
            docker buildx imagetools create \
              --tag "${REPO}/vppem-${image}:${GITHUB_REF_NAME}" \
              "${REPO}/vppem-${image}:${TAG}"
          done

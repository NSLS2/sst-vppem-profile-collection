name: Pods smoke test

on:
  pull_request:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  pods-smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Use upstream images for CI by default (can be overridden per-run).
      NBS_COLLECTION_PACKAGES: ${{ github.workspace }}/collection_packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true
          environments: pods

      - name: Pods CLI smoke test
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${NBS_COLLECTION_PACKAGES}"

          pixi run -e pods pods -- --help
          pixi run -e pods podman-compose --version || true

          pixi run -e pods pods-list | tee pods-list.txt
          grep -q "Available services" pods-list.txt

      - name: Start minimal pods (bluesky-services, queueserver, sim)
        shell: bash
        run: |
          set -euo pipefail

          podman --version
          podman info --debug || true

          pixi run -e pods pods-start bluesky-services queueserver sim
          sleep 10
          for _ in $(seq 1 60); do
            podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "acq_qs" podman-ps.txt && grep -q "nbs-sim" podman-ps.txt && grep -q "mongo" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for containers to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Tear down minimal pods
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          pixi run -e pods pods-stop bluesky-services queueserver sim || true
          podman ps -a || true


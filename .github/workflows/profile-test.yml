name: VPPEM Bluesky Profile Testing

on:
  pull_request:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  pods-smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NBS_COLLECTION_PACKAGES: ${{ github.workspace }}/collection_packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true
          environments: pods

      - name: Pods CLI smoke test
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${NBS_COLLECTION_PACKAGES}"
          mkdir -p /tmp/proposals

          if [ ! -d "${NBS_COLLECTION_PACKAGES}/vppem/.git" ]; then
            git clone https://github.com/nsls-ii-sst/vppem.git "${NBS_COLLECTION_PACKAGES}/vppem"
          else
            git -C "${NBS_COLLECTION_PACKAGES}/vppem" pull --ff-only
          fi

          pixi run -e pods pods -- --help
          pixi run -e pods podman-compose --version || true

          pixi run -e pods pods-list | tee pods-list.txt
          grep -q "Available services" pods-list.txt

      - name: Start bluesky-services
        shell: bash
        run: |
          set -euo pipefail

          podman --version
          podman info --debug || true

          pixi run -e pods pods-start bluesky-services

          for i in $(seq 1 60); do
            echo "wait_iter=${i}"
            timeout 10s podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "bluesky-services_mongo" podman-ps.txt && grep -q "bluesky-services_kafka" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for bluesky-services to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Start ADSim
        shell: bash
        run: |
          set -euo pipefail

          pixi run -e pods pods-start adsim

          for _ in $(seq 1 60); do
            timeout 10s podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "adsim_adsim" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for ADSim to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Start sim
        shell: bash
        run: |
          set -euo pipefail

          pixi run -e pods pods-start --dev sim

          for _ in $(seq 1 60); do
            timeout 10s podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "sim_sim" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for sim to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Start queueserver test
        shell: bash
        run: |
          set -euo pipefail

          (
            while true; do
              echo "=== $(date -u) host resources ==="
              free -h || true
              echo "--- /proc/meminfo (key lines) ---"
              grep -E "^(MemTotal|MemAvailable|SwapTotal|SwapFree|OOM)" /proc/meminfo || true
              echo "--- load average ---"
              cat /proc/loadavg || true
              echo "--- podman container stats (no-stream) ---"
              podman stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}" 2>/dev/null || true
              echo "--- podman ps ---"
              podman ps --format '{{.Names}}\t{{.Status}}' || true
              echo "--- queueserver logs (tail 30) ---"
              podman logs --tail 30 queueserver 2>&1 || true
              echo "==="
              sleep 20
            done
          ) &
          MONITOR_PID=$!

          pixi run -e pods pods-start --test queueserver
          EXIT_CODE=$?

          kill $MONITOR_PID 2>/dev/null || true
          exit $EXIT_CODE

      - name: Tear down minimal pods
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          pixi run -e pods pods-stop queueserver sim bluesky-services adsim || true
          podman ps -a || true


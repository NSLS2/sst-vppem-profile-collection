version: '3'

services:
  queueserver:
    build:
      context: .
      dockerfile: images/profile/Containerfile
      args:
        PIXI_ENV: qs
    image: vppem-queueserver:latest

  gui:
    build:
      context: .
      dockerfile: images/profile/Containerfile
      args:
        PIXI_ENV: gui
    image: vppem-gui:latest

  sim:
    build:
      context: .
      dockerfile: images/profile/Containerfile
      args:
        PIXI_ENV: sim
    image: vppem-sim:latest

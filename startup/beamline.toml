[configuration]
baseline = []
has_slits = false
has_motorized_samples = false
has_motorized_eref = false
has_polarization = false

[detector_sets.default]
primary = ""
normalization = ""
reference = ""

[devices]

[settings]
startup_modules = ["nbs_bl.startup", "vppem.startup"]
beamline = ["sst2", "sst1"]

[settings.plans]


[settings.redis.md]
host = "xf07id1-vppem-redis1.nsls2.bnl.gov"
ssl = true
port = 6380
#host = "info.sst.nsls2.bnl.gov"
#prefix = "vppem-"
#db = 0

[settings.redis.info]
host = "xf07id1-vppem-redis1.nsls2.bnl.gov"
ssl= true
port = 6380
#host = "info.sst.nsls2.bnl.gov"
#prefix = "vppem-"
db = 1

[settings.logging]
enabled = true
method = "nslsii"

[settings.tiled_writer]
enabled = true
profile = "nsls2"
catalog_path = ["vppem", "raw"]
api_key_env = "TILED_BLUESKY_WRITING_API_KEY_NEXAFS"
subscribe_method = "tiled_writer"

[settings.zmq]
enabled = true
hostname = "localhost"
start_proxy = true
port = 5577
